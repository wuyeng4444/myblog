media:
  input: public/gallery
  output: /gallery
  rename: random
  extensions: [jpg, jpeg, png, webp, gif]
content:
  - name: home
    label: 首页介绍
    type: file
    path: content/home-content.json
    format: json
    fields:
      - name: content
        label: 个人介绍
        type: object
        fields:
          - { name: eyebrow, label: 顶部小标题, type: string, required: true }
          - { name: greeting, label: 问候语, type: string, required: true }
          - { name: name, label: 名字, type: string, required: true }
          - { name: lead, label: 一句话介绍, type: text, required: true }
          - { name: introduction, label: 个人介绍, type: text, required: true }
          - { name: caption, label: 头像下方文字, type: string, required: true }
  - name: moments
    label: 说说
    type: file
    path: content/moments.json
    format: json
    fields:
      - name: moments
        label: 我的说说
        type: object
        list:
          max: 1000
          collapsible:
            collapsed: true
            summary: '{content}'
        fields:
          - { name: id, label: 编号, type: uuid, hidden: true }
          - name: date
            label: 发布时间
            type: date
            required: true
            options:
              time: true
              format: "yyyy-MM-dd'T'HH:mm:ssXXX"
          - { name: content, label: 说点什么, type: text, required: true }
          - { name: location, label: 地点, type: string, default: '' }
          - name: images
            label: 图片
            type: image
            default: []
            list: { max: 9 }
  - name: writing
    label: 文本作品与章节
    type: collection
    path: posts
    format: yaml-frontmatter
    subfolders: false
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      primary: title
      fields: [title, series, order, date, draft]
      sort: date
      order: desc
    fields:
      - { name: title, label: 标题或章节名, type: string, required: true }
      - name: date
        label: 日期
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - { name: description, label: 简介, type: text }
      - { name: series, label: 所属作品（独立文章可留空）, type: string }
      - { name: order, label: 章节顺序, type: number, default: 0 }
      - name: draft
        label: 草稿（不在网站展示）
        type: boolean
        default: true
        description: 仓库是公开的，草稿仍可在 GitHub 中查看；关闭此开关才会发布到网站。
      - { name: cover, label: 封面, type: image }
      - { name: tags, label: 标签, type: string, list: true }
      - { name: body, label: 正文, type: rich-text, required: true }
  - name: works
    label: 网盘作品
    type: file
    path: content/works.json
    format: json
    fields:
      - name: works
        label: 作品列表
        type: object
        list:
          max: 100
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
          - { name: id, label: 编号, type: uuid, hidden: true }
          - { name: title, label: 作品名称, type: string, required: true }
          - { name: description, label: 简介, type: text, default: '' }
          - { name: url, label: 网盘链接, type: string, required: true }
          - { name: code, label: 提取码, type: string, default: '' }
